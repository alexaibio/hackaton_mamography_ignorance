seed: 42

# coarse server-side filter for the download only, to avoid pulling children and men.
# keep it well below the training cohort boundary — the cohort is defined separately
fetch:
  # how far back to pull dated resources. the earliest invitations in this window
  # have a truncated history, so train on a shorter span than you download
  history_years: 5

  patient:
    gender: female
    min_age: 35

# name of the modelling table written to data/processed/
modelling_table: invitations

# attendance within 3, 6 or 12 months is given as three separate columns.
# picking one fixes the attendance window; true = screened, so ignorance is the negative class
target: screening_12m_flag

# the other two screening flags are the same outcome at a different horizon —
# never use them as features
leakage_exclude:
  - screening_3m_flag
  - screening_6m_flag
  - invitation_id
  - person_id

training_features:
  categorical:
    - age_band
    - vzp_territorial_area
    - gp_reg_duration_band
    - gyn_reg_duration_band
  numeric:
    - prior_invitation_count
    - months_last_invitation
    - invitation_sequence
    - healthcare_contact_12m_cnt
    - insurance_duration_years
    - prior_screen_count_5y
    - months_since_last_screen
    - gp_prevention_24m_cnt
    - gyn_prevention_24m_cnt
    - other_screening_36m_cnt
    - dental_prevention_24m_cnt
  boolean:
    - first_invitation
    - gp_registered
    - gyn_registered_flag
    - never_screened_before_flag

split:
  test_size: 0.1
  stratify: true

catboost:
  iterations: 1000
  learning_rate: 0.05
  depth: 6
  loss_function: Logloss
  eval_metric: AUC
  early_stopping_rounds: 50
  verbose: 100

segments:
  n_clusters: 5

llm:
  model: gpt-4.1-mini
  temperature: 0.4
  max_output_tokens: 400
  language: Czech
